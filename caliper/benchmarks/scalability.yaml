test:
  name: ehr-scalability
  workers: { number: 2 }
  rounds:
    - label: W1 write @25
      txDuration: 20
      rateControl: { type: fixed-rate, opts: { tps: 25 } }
      workload: { module: workload/createRecord.js, arguments: { prefix: sw25, registerPatient: true } }
    - label: W1 write @50
      txDuration: 20
      rateControl: { type: fixed-rate, opts: { tps: 50 } }
      workload: { module: workload/createRecord.js, arguments: { prefix: sw50, registerPatient: true } }
    - label: W1 write @100
      txDuration: 20
      rateControl: { type: fixed-rate, opts: { tps: 100 } }
      workload: { module: workload/createRecord.js, arguments: { prefix: sw100, registerPatient: true } }
    - label: W1 write @150
      txDuration: 20
      rateControl: { type: fixed-rate, opts: { tps: 150 } }
      workload: { module: workload/createRecord.js, arguments: { prefix: sw150, registerPatient: true } }
    - label: W1 write @200
      txDuration: 20
      rateControl: { type: fixed-rate, opts: { tps: 200 } }
      workload: { module: workload/createRecord.js, arguments: { prefix: sw200, registerPatient: true } }
    - label: W1 write @250
      txDuration: 20
      rateControl: { type: fixed-rate, opts: { tps: 250 } }
      workload: { module: workload/createRecord.js, arguments: { prefix: sw250, registerPatient: true } }
    - label: W1 write @300
      txDuration: 20
      rateControl: { type: fixed-rate, opts: { tps: 300 } }
      workload: { module: workload/createRecord.js, arguments: { prefix: sw300, registerPatient: true } }
    - label: W2 read @100
      txDuration: 20
      rateControl: { type: fixed-rate, opts: { tps: 100 } }
      workload: { module: workload/readRecord.js, arguments: { prefix: sw25, poolSize: 200 } }
    - label: W2 read @200
      txDuration: 20
      rateControl: { type: fixed-rate, opts: { tps: 200 } }
      workload: { module: workload/readRecord.js, arguments: { prefix: sw25, poolSize: 200 } }
    - label: W2 read @300
      txDuration: 20
      rateControl: { type: fixed-rate, opts: { tps: 300 } }
      workload: { module: workload/readRecord.js, arguments: { prefix: sw25, poolSize: 200 } }
    - label: W2 read @400
      txDuration: 20
      rateControl: { type: fixed-rate, opts: { tps: 400 } }
      workload: { module: workload/readRecord.js, arguments: { prefix: sw25, poolSize: 200 } }
    - label: W2 read @500
      txDuration: 20
      rateControl: { type: fixed-rate, opts: { tps: 500 } }
      workload: { module: workload/readRecord.js, arguments: { prefix: sw25, poolSize: 200 } }
    - label: W2 read @600
      txDuration: 20
      rateControl: { type: fixed-rate, opts: { tps: 600 } }
      workload: { module: workload/readRecord.js, arguments: { prefix: sw25, poolSize: 200 } }
monitors:
  resource:
    - module: docker
      options:
        interval: 2
        containers: [peer0.org1.example.com, peer0.org2.example.com, orderer.example.com, couchdb0, couchdb1, peer0org1_ehr_ccaas, peer0org2_ehr_ccaas]
