test:
  name: ehr-performance
  description: EHR chaincode workloads at a fixed send rate of 100 TPS
  workers: { number: 2 }
  rounds:
    - label: W1 Create record
      txNumber: 1000
      rateControl: { type: fixed-rate, opts: { tps: 100 } }
      workload: { module: workload/createRecord.js, arguments: { prefix: main, registerPatient: true } }
    - label: W2 Read record
      txNumber: 1000
      rateControl: { type: fixed-rate, opts: { tps: 100 } }
      workload: { module: workload/readRecord.js, arguments: { prefix: main, poolSize: 500 } }
    - label: W3 Grant consent
      txNumber: 1000
      rateControl: { type: fixed-rate, opts: { tps: 100 } }
      workload: { module: workload/grantAccess.js, arguments: { prefix: main } }
    - label: W4 Revoke consent
      txNumber: 1000
      rateControl: { type: fixed-rate, opts: { tps: 100 } }
      workload: { module: workload/revokeAccess.js, arguments: { prefix: main } }
    - label: W5 Audited access
      txNumber: 1000
      rateControl: { type: fixed-rate, opts: { tps: 100 } }
      workload: { module: workload/accessRecord.js, arguments: { prefix: main, poolSize: 500 } }
    - label: Setup query data
      txNumber: 40
      rateControl: { type: fixed-rate, opts: { tps: 20 } }
      workload: { module: workload/createRecord.js, arguments: { prefix: qry, registerPatient: true } }
    - label: W6 Query patient records
      txNumber: 1000
      rateControl: { type: fixed-rate, opts: { tps: 100 } }
      workload: { module: workload/queryPatient.js, arguments: { prefix: qry } }
monitors:
  resource:
    - module: docker
      options:
        interval: 2
        containers: [peer0.org1.example.com, peer0.org2.example.com, orderer.example.com, couchdb0, couchdb1, peer0org1_ehr_ccaas, peer0org2_ehr_ccaas]
