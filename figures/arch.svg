<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d4a45"/></marker></defs>
<rect width="1600" height="1220" fill="#ffffff"/>
<rect x="30" y="20" width="1540" height="160" rx="12" fill="#f6f8f7" stroke="#9fb5ac" stroke-width="1.4" stroke-dasharray="6 4"/><text x="46" y="46" font-size="15" font-weight="700" fill="#0f6b4f" letter-spacing="0.4">PRESENTATION LAYER  ·  React 18 + TypeScript single-page app (Vite 5), runs in the user's browser</text><rect x="60" y="60" width="350" height="92" rx="8" fill="#e3f1ec" stroke="#0f6b4f" stroke-width="1.6"/><text x="235.0" y="101.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2421">Patient dashboard</text><text x="235.0" y="123.0" text-anchor="middle" font-size="14" fill="#5d6b66">my records · consent &amp; sharing · access log</text><rect x="438" y="60" width="350" height="92" rx="8" fill="#e3f1ec" stroke="#0f6b4f" stroke-width="1.6"/><text x="613.0" y="101.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2421">Clinician dashboard</text><text x="613.0" y="123.0" text-anchor="middle" font-size="14" fill="#5d6b66">enrol patient · records · break-glass access</text><rect x="816" y="60" width="350" height="92" rx="8" fill="#e3f1ec" stroke="#0f6b4f" stroke-width="1.6"/><text x="991.0" y="101.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2421">Auditor dashboard</text><text x="991.0" y="123.0" text-anchor="middle" font-size="14" fill="#5d6b66">integrity check · ledger history · audit trail</text><rect x="1194" y="60" width="350" height="92" rx="8" fill="#e3f1ec" stroke="#0f6b4f" stroke-width="1.6"/><text x="1369.0" y="101.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2421">Admin dashboard</text><text x="1369.0" y="123.0" text-anchor="middle" font-size="14" fill="#5d6b66">staff accounts · facility identities</text><line x1="800" y1="180" x2="800" y2="238" stroke="#3d4a45" stroke-width="1.8" marker-end="url(#ah)"/><text x="815" y="214" font-size="13.5" fill="#1c2421" text-anchor="start" font-style="italic">HTTPS · JSON · JWT bearer token</text><rect x="30" y="240" width="1540" height="330" rx="12" fill="#f6f8f7" stroke="#9fb5ac" stroke-width="1.4" stroke-dasharray="6 4"/><text x="46" y="266" font-size="15" font-weight="700" fill="#0f6b4f" letter-spacing="0.4">APPLICATION LAYER  ·  Node.js 22 + Express 5 REST API written in TypeScript</text><rect x="60" y="285" width="1480" height="64" rx="8" fill="#e3f1ec" stroke="#0f6b4f" stroke-width="1.6"/><text x="800.0" y="312.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2421">Security middleware</text><text x="800.0" y="334.0" text-anchor="middle" font-size="14" fill="#5d6b66">Helmet headers  ·  CORS allow-list  ·  express-rate-limit  ·  JWT verification (HS256)  ·  role guard  ·  Zod input validation</text><line x1="800" y1="349" x2="800" y2="385" stroke="#3d4a45" stroke-width="1.8" marker-end="url(#ah)"/><rect x="560" y="385" width="480" height="64" rx="8" fill="#e3f1ec" stroke="#0f6b4f" stroke-width="1.6"/><text x="800.0" y="412.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2421">REST controllers</text><text x="800.0" y="434.0" text-anchor="middle" font-size="14" fill="#5d6b66">/auth  /patients  /records  /consents  /audit  /staff</text><rect x="60" y="480" width="420" height="70" rx="8" fill="#e3f1ec" stroke="#0f6b4f" stroke-width="1.6"/><text x="270.0" y="510.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2421">Data-access service</text><text x="270.0" y="532.0" text-anchor="middle" font-size="14" fill="#5d6b66">Mongoose 9 ODM · schemas &amp; validation</text><rect x="590" y="480" width="420" height="70" rx="8" fill="#e3f1ec" stroke="#0f6b4f" stroke-width="1.6"/><text x="800.0" y="510.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2421">Crypto service</text><text x="800.0" y="532.0" text-anchor="middle" font-size="14" fill="#5d6b66">AES-256-GCM encrypt / decrypt · SHA-256 digest</text><rect x="1120" y="480" width="420" height="70" rx="8" fill="#e3f1ec" stroke="#0f6b4f" stroke-width="1.6"/><text x="1330.0" y="510.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2421">Ledger service</text><text x="1330.0" y="532.0" text-anchor="middle" font-size="14" fill="#5d6b66">Fabric Gateway SDK 1.12 over gRPC</text><path d="M640,449 L640,465 L270,465 L270,480" fill="none" stroke="#3d4a45" stroke-width="1.8" marker-end="url(#ah)"/><line x1="800" y1="449" x2="800" y2="480" stroke="#3d4a45" stroke-width="1.8" marker-end="url(#ah)"/><path d="M960,449 L960,465 L1330,465 L1330,480" fill="none" stroke="#3d4a45" stroke-width="1.8" marker-end="url(#ah)"/><rect x="30" y="610" width="420" height="590" rx="12" fill="#fbf8f1" stroke="#d9c7a3" stroke-width="1.4" stroke-dasharray="6 4"/><text x="46" y="636" font-size="15" font-weight="700" fill="#0f6b4f" letter-spacing="0.4">OFF-CHAIN STORAGE</text><path d="M70,672 a170.0,12 0 0,0 340,0 a170.0,12 0 0,0 -340,0 v126 a170.0,12 0 0,0 340,0 v-126" fill="#fdf1dc" stroke="#8a5a00" stroke-width="1.6"/><text x="240.0" y="716.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1c2421">MongoDB 7</text><text x="240.0" y="737.0" text-anchor="middle" font-size="13.5" fill="#5d6b66">users · patients</text><text x="240.0" y="758.0" text-anchor="middle" font-size="13.5" fill="#5d6b66">medicalrecords (encrypted</text><text x="240.0" y="779.0" text-anchor="middle" font-size="13.5" fill="#5d6b66">payload + SHA-256 + tx id)</text><text x="240" y="860" text-anchor="middle" font-size="13.5" fill="#5d6b66">Bulky, frequently read data stays here,</text><text x="240" y="880" text-anchor="middle" font-size="13.5" fill="#5d6b66">always encrypted at rest. Its integrity is</text><text x="240" y="900" text-anchor="middle" font-size="13.5" fill="#5d6b66">proved by the hash held on the ledger.</text><path d="M270,550 L270,660" fill="none" stroke="#3d4a45" stroke-width="1.8" marker-end="url(#ah)"/><text x="282" y="596" font-size="13.5" fill="#1c2421" text-anchor="start" font-style="italic">Mongoose</text><rect x="480" y="610" width="1090" height="590" rx="12" fill="#f3f6fb" stroke="#9fb3d4" stroke-width="1.4" stroke-dasharray="6 4"/><text x="496" y="636" font-size="15" font-weight="700" fill="#0f6b4f" letter-spacing="0.4">BLOCKCHAIN LAYER  ·  Hyperledger Fabric 2.5 permissioned network · channel 'ehrchannel' · Docker</text><rect x="510" y="700" width="330" height="480" rx="10" fill="#ffffff" stroke="#1d4f91" stroke-width="1.4"/><text x="675" y="728" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4f91">Org1MSP  ·  Hospital A</text><text x="675" y="748" text-anchor="middle" font-size="13.5" fill="#5d6b66">tertiary teaching hospital</text><rect x="540" y="770" width="270" height="66" rx="8" fill="#e6eef9" stroke="#1d4f91" stroke-width="1.6"/><text x="675.0" y="798.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2421">peer0.org1 :7051</text><text x="675.0" y="820.0" text-anchor="middle" font-size="14" fill="#5d6b66">endorsing &amp; committing peer</text><rect x="540" y="880" width="270" height="74" rx="8" fill="#e6eef9" stroke="#1d4f91" stroke-width="1.6"/><text x="675.0" y="901.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2421">EHR chaincode v1.1</text><text x="675.0" y="923.0" text-anchor="middle" font-size="14" fill="#5d6b66">TypeScript · fabric-contract-api</text><text x="675.0" y="945.0" text-anchor="middle" font-size="14" fill="#5d6b66">chaincode-as-a-service</text><path d="M565,1002 a110.0,12 0 0,0 220,0 a110.0,12 0 0,0 -220,0 v68 a110.0,12 0 0,0 220,0 v-68" fill="#e6eef9" stroke="#1d4f91" stroke-width="1.6"/><text x="675.0" y="1039.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1c2421">CouchDB 3</text><text x="675.0" y="1060.0" text-anchor="middle" font-size="13.5" fill="#5d6b66">world state + index</text><rect x="540" y="1110" width="270" height="52" rx="8" fill="#ffffff" stroke="#1d4f91" stroke-width="1.6"/><text x="675.0" y="1142.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2421">Fabric CA (Org1) :7054</text><line x1="675" y1="836" x2="675" y2="880" stroke="#3d4a45" stroke-width="1.6"/><line x1="675" y1="954" x2="675" y2="990" stroke="#3d4a45" stroke-width="1.6"/><rect x="1210" y="700" width="330" height="480" rx="10" fill="#ffffff" stroke="#1d4f91" stroke-width="1.4"/><text x="1375" y="728" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4f91">Org2MSP  ·  Facility B</text><text x="1375" y="748" text-anchor="middle" font-size="13.5" fill="#5d6b66">primary health centre</text><rect x="1240" y="770" width="270" height="66" rx="8" fill="#e6eef9" stroke="#1d4f91" stroke-width="1.6"/><text x="1375.0" y="798.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2421">peer0.org2 :9051</text><text x="1375.0" y="820.0" text-anchor="middle" font-size="14" fill="#5d6b66">endorsing &amp; committing peer</text><rect x="1240" y="880" width="270" height="74" rx="8" fill="#e6eef9" stroke="#1d4f91" stroke-width="1.6"/><text x="1375.0" y="901.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2421">EHR chaincode v1.1</text><text x="1375.0" y="923.0" text-anchor="middle" font-size="14" fill="#5d6b66">TypeScript · fabric-contract-api</text><text x="1375.0" y="945.0" text-anchor="middle" font-size="14" fill="#5d6b66">chaincode-as-a-service</text><path d="M1265,1002 a110.0,12 0 0,0 220,0 a110.0,12 0 0,0 -220,0 v68 a110.0,12 0 0,0 220,0 v-68" fill="#e6eef9" stroke="#1d4f91" stroke-width="1.6"/><text x="1375.0" y="1039.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1c2421">CouchDB 3</text><text x="1375.0" y="1060.0" text-anchor="middle" font-size="13.5" fill="#5d6b66">world state + index</text><rect x="1240" y="1110" width="270" height="52" rx="8" fill="#ffffff" stroke="#1d4f91" stroke-width="1.6"/><text x="1375.0" y="1142.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2421">Fabric CA (Org2) :8054</text><line x1="1375" y1="836" x2="1375" y2="880" stroke="#3d4a45" stroke-width="1.6"/><line x1="1375" y1="954" x2="1375" y2="990" stroke="#3d4a45" stroke-width="1.6"/><rect x="875" y="880" width="300" height="92" rx="8" fill="#e6eef9" stroke="#1d4f91" stroke-width="1.6"/><text x="1025.0" y="910.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2421">Ordering service</text><text x="1025.0" y="932.0" text-anchor="middle" font-size="14" fill="#5d6b66">Raft consensus</text><text x="1025.0" y="954.0" text-anchor="middle" font-size="14" fill="#5d6b66">orderer.example.com :7050</text><line x1="840" y1="803" x2="1010" y2="880" stroke="#3d4a45" stroke-width="1.8" marker-end="url(#ah)" marker-start="url(#ah)"/><line x1="1210" y1="803" x2="1040" y2="880" stroke="#3d4a45" stroke-width="1.8" marker-end="url(#ah)" marker-start="url(#ah)"/><text x="1025" y="835" text-anchor="middle" font-size="13.5" fill="#1c2421" font-style="italic">transactions → ordered blocks</text><rect x="875" y="1030" width="300" height="62" rx="8" fill="#ffffff" stroke="#1d4f91" stroke-width="1.6"/><text x="1025.0" y="1056.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2421">Membership Service Provider</text><text x="1025.0" y="1078.0" text-anchor="middle" font-size="14" fill="#5d6b66">X.509 identities per facility</text><path d="M1250,550 L1250,590 L790,590 L790,770" fill="none" stroke="#3d4a45" stroke-width="1.8" marker-end="url(#ah)"/><text x="805" y="582" font-size="13.5" fill="#1c2421" text-anchor="start" font-style="italic">gRPC/TLS: endorse · submit · evaluate</text><path d="M1490,550 L1490,770" fill="none" stroke="#3d4a45" stroke-width="1.8" marker-end="url(#ah)"/><text x="1500" y="660" font-size="13.5" fill="#1c2421" text-anchor="start" font-style="italic">gRPC/TLS</text>
